<!-- open-dorms.component.html -->
<div *ngIf="loading">Loading dorms...</div>
<div *ngIf="error">{{ error }}</div>

<table *ngIf="!loading && !error" class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>City</th>
      <th>Type</th>
      <th>Capacity</th>
      <th>Occupied</th>
      <th>Average Rating</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let dorm of dorms">
      <td>{{ dorm.name }}</td>
      <td>{{ dorm.city }}</td>
      <td>{{ dorm.type }}</td>
      <td>{{ dorm.capacity }}</td>
      <td>{{ dorm.occupied }}</td>
      <td>{{ dorm.average_rating | number:'1.1-2' }}</td>
    </tr>
  </tbody>
</table>
<div *ngIf="!loading && !error" class="mb-3 d-flex justify-content-end">
  <button (click)="exportToJSON()" class="btn btn-primary me-2">📥 Export JSON</button>
  <button (click)="exportToCSV()" class="btn btn-secondary">📥 Export CSV</button>
</div>
<a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank">
  <img src="https://licensebuttons.net/p/zero/1.0/88x31.png" alt="CC0" />
</a>
