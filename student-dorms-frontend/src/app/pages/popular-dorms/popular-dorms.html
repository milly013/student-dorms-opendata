
<div class="container mt-4">
  <h2>Popular Dorms</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Name</th>
        <th>Address</th>
        <th>Type</th>
        <th>Capacity</th>
        <th>Occupied</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let dorm of popularDorms; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ dorm.name }}</td>
        <td>{{ dorm.address }}, {{ dorm.city }}</td>
        <td>{{ dorm.type }}</td>
        <td>{{ dorm.capacity }}</td>
        <td>{{ dorm.occupied }}</td>
      </tr>
    </tbody>
  </table>
</div>
<div class="mb-3 d-flex justify-content-end">
  <button (click)="exportToJSON()" class="btn btn-primary me-2">📥 Export JSON</button>
  <button (click)="exportToCSV()" class="btn btn-secondary">📥 Export CSV</button>
</div>
<a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank">
