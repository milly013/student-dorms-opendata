<div class="container mt-5">
  <h2>Zahtjev za iseljenje iz doma</h2>

  <form (ngSubmit)="submitMoveOut()" class="mt-3">
    <div class="mb-3">
      <label for="dormId" class="form-label">Dorm ID</label>
      <input type="text" id="dormId" class="form-control" [(ngModel)]="dormId" name="dormId" required>
    </div>

    <div class="mb-3">
      <label for="roomType" class="form-label">Tip sobe</label>
      <input type="text" id="roomType" class="form-control" [(ngModel)]="roomType" name="roomType" required>
    </div>

    <button type="submit" class="btn btn-danger">Pošalji zahtjev</button>
  </form>

  <div *ngIf="message" class="alert alert-success mt-3">
    {{ message }}
  </div>

  <div *ngIf="error" class="alert alert-danger mt-3">
    {{ error }}
  </div>
</div>
